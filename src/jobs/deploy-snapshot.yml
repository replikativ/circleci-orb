description: |
  Deploy a snapshot version to Clojars
  if there is SNAPSHOT in the version string.
executor: clojurecli
parameters:
  jarname:
    default: "libary"
    type: string
steps:
  - attach_workspace:
      at: /home/circleci
  - run:
      name: Install xmllint
      command: sudo apt-get update && sudo apt-get install libxml2-utils
  - run:
      name: Deploy Snapshot to Clojars
      command: |
        XPATH='/*[local-name()="project"]/*[local-name()="version"]/text()'
        VERSION=$(xmllint --xpath "$XPATH" pom.xml)
        if [[ ${VERSION} =~ .*-SNAPSHOT ]]; then
            DEPS='{:deps {slipset/deps-deploy {:mvn/version "RELEASE"}}}'
            clojure -Sdeps "$DEPS" -m deps-deploy.deps-deploy \
              deploy "replikativ-<<parameters.jarname>>.jar"
        else
            echo "Not releasing because this is no snapshot: $VERSION"
            exit 0
        fi
